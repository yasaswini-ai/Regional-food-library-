    <script>
      (function() {
        // Intercept console.error to filter out benign [vite] WebSocket notices in AI Studio preview
        const origConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.map(function(a) {
            return typeof a === 'object' ? (a && a.message ? a.message : JSON.stringify(a)) : String(a);
          }).join(' ');
          if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('@vite/client')) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        // Mock WebSocket for vite-hmr so it never throws "WebSocket closed without opened"
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && (protocols === 'vite-hmr' || url.includes('/@vite/client') || url.includes('vite') || (Array.isArray(protocols) && protocols.includes('vite-hmr')))) {
              var emitter = new EventTarget();
              emitter.url = url;
              emitter.readyState = 1; // OPEN
              emitter.protocol = 'vite-hmr';
              emitter.extensions = '';
              emitter.bufferedAmount = 0;
              emitter.binaryType = 'blob';
              emitter.send = function() {};
              emitter.close = function() {
                emitter.readyState = 3;
                emitter.dispatchEvent(new CloseEvent('close', { wasClean: true, code: 1000 }));
              };
              setTimeout(function() {
                emitter.dispatchEvent(new Event('open'));
              }, 10);
              return emitter;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (String(event.reason.message).includes('WebSocket') || String(event.reason).includes('WebSocket'))) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          if (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client'))) {
            event.preventDefault();
            return true;
          }
        });
      })();
    </script>
